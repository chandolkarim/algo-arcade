# 알고리즘 오락실 — 테스트 → 데이터 생성 → GitHub Pages 배포
#
# 언제 실행되나
#   push        main에 코드를 올릴 때 (테스트 결과를 먼저 확인)
#   schedule    매시 7분(UTC) = 한국 시각 매시 7분. 김프 기록 1건 추가, 플레이 기록 다시 계산
#               GitHub 무료 예약 실행은 자주 밀리거나 빠진다(첫날 18시간에 3번). 그래서 매시간 돌아야만
#               맞는 계산은 두지 않고, 2·5·7번은 "오늘 이미 계산했으면 건너뛰기"로 하루 한 번만 다시 계산한다.
#   workflow_dispatch  구글 시트를 고친 뒤 Actions 화면의 Run workflow로 바로 반영
#
# 테스트가 실패하거나 시트 데이터가 잘못되면 배포하지 않는다. 이전에 배포한 화면이 그대로 남는다.
# 배포된 김프 기록을 읽지 못해도 배포하지 않는다(빈 기록으로 덮어쓰지 않으려고).
# 시트 접속 실패·시세 수집 실패는 데이터 잘못이 아니므로 이전 결과로 계속 배포한다.
# 인증키는 쓰지 않는다. 시트 주소는 공개돼도 되는 값이라 Secrets가 아니라 Variables(SHEET_CSV_URL)에 둔다.
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 4번 FOREIGN FLOW 계산 테스트
        run: python -m unittest discover -s foreign-flow -p 'test_*.py' -v
      - name: 2번 REBOUND 엔진 테스트
        run: python -m unittest discover -s rebound -p 'test_*.py' -v
      - name: 1번 플레이 기록 검사 테스트
        run: python -m unittest discover -s records -p 'test_*.py' -v
      - name: 3번 김프 기록 테스트
        run: python -m unittest discover -s kimchi -p 'test_*.py' -v
      - name: 5번 BREAKOUT 20 엔진 테스트
        run: python -m unittest discover -s breakout -p 'test_*.py' -v
      - name: 6번 BLIND CHART 계산 테스트 (미래 데이터 누수 검사 포함)
        run: python -m unittest discover -s blind -p 'test_*.py' -v
      - name: 7번 CLOCK TOWER 계산 테스트
        run: python -m unittest discover -s clock -p 'test_*.py' -v
      - name: 화면 스크립트 문법 검사
        run: for f in assets/*.js; do node --check "$f"; done

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 1번 플레이 기록 (구글 시트 → 검사 → 24시간 뒤 결과)
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: python records/build.py --previous "https://chandolkarim.github.io/algo-arcade/data/records.json"
      - name: 3번 김프 기록 1건 추가 (배포된 기록을 이어 받음)
        run: python kimchi/record.py --previous "https://chandolkarim.github.io/algo-arcade/data/kimchi-history.json"
      - name: 6번 BLIND CHART 상황 통계·문제 목록 갱신 (실패하면 저장소에 있는 이전 결과 사용)
        run: python blind/build.py || echo "::warning::BLIND CHART 갱신 실패 — 이전 결과로 배포"
      - name: 7번 CLOCK TOWER 시간대 지도 (하루 한 번만 다시 계산, 실패하면 이전 결과 사용)
        run: python clock/build.py --previous "https://chandolkarim.github.io/algo-arcade/data/clock.json" || echo "::warning::CLOCK TOWER 갱신 실패 — 이전 결과로 배포"
      - name: 2번 REBOUND·5번 BREAKOUT 20 (하루 한 번, 실패한 종목은 배포된 이전 결과 유지)
        run: |
          python rebound/update.py --previous "https://chandolkarim.github.io/algo-arcade/data/rebound.json" || echo "::warning::REBOUND 일부 종목 갱신 실패 — 이전 결과 유지"
          python breakout/update.py --previous "https://chandolkarim.github.io/algo-arcade/data/breakout.json" || echo "::warning::BREAKOUT 일부 종목 갱신 실패 — 이전 결과 유지"
      - name: 공개할 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html 404.html machines assets data _site/
          echo "배포 커밋 ${GITHUB_SHA::7} · $(date -u +%FT%TZ)" > _site/build.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
